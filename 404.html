
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Sports Club - 404 Route Misaligned</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-portal-body">

    <!-- Ambient Shadow Shroud Backlight Background -->
    <div class="error-mesh-halo"></div>

    <!-- MASTER CONTENT VIEWPORT CONSOLE -->
    <main class="error-console-hull">
        <div class="error-giant-badge">4<span>0</span>4</div>
        <h1 class="error-main-title">Tactical Route Misaligned</h1>
        <p class="error-description">
            The processing coordinates you requested have shifted outside active arena boundaries. Return to your previous roster station or sync with the primary hub index.
        </p>

        <!-- Symmetrical Inline Control Buttons Axis -->
        <div class="error-actions-axis">
            <!-- Exact requested history execution re-entry tracking link path button -->
            <button type="button" class="error-btn-secondary" id="historyBackTriggerBtn">
                &larr; Return To Previous Section
            </button>
            <a href="index.html" class="error-btn-primary">Home Base Index &rarr;</a>
        </div>
    </main>

  

  <style>
   /* --- COMPACT HIGH-PERFORMANCE 404 THEME DESIGN SYSTEM --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.error-portal-body {
    min-height: 100vh;
    width: 100%;
    background-color: #ffffff; /* Clean white canvas theme alignment */
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    overflow: hidden;
    position: relative;
}

.error-mesh-halo {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle at center, rgba(255, 74, 17, 0.06) 0%, transparent 65%);
    z-index: 1;
    pointer-events: none;
}

.error-console-hull {
    width: 100%;
    max-width: 620px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 5;
    animation: errorBezelEntrance 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes errorBezelEntrance {
    0% { opacity: 0; transform: translateY(20px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.error-giant-badge {
    font-size: clamp(100px, 16vw, 150px);
    font-weight: 900;
    color: #0f1115;
    line-height: 0.95;
    letter-spacing: -4px;
    margin-bottom: 15px;
    position: relative;
    cursor: default;
}

.error-giant-badge span {
    color: #ff4a11; /* System Neon Orange Primary */
    display: inline-block;
    transition: text-shadow 0.4s ease, transform 0.4s ease;
}

.error-console-hull:hover .error-giant-badge span {
    text-shadow: 0 0 30px rgba(255, 74, 17, 0.6), 0 0 60px rgba(255, 74, 17, 0.2);
    transform: scale(1.02) rotate(2deg);
}

.error-main-title {
    font-size: clamp(24px, 4.5vw, 34px);
    font-weight: 900;
    color: #0f1115;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    margin-bottom: 18px;
    line-height: 1.1;
}

.error-description {
    font-size: clamp(14.5px, 2vw, 16.5px);
    color: #555e6b;
    line-height: 1.6;
    max-width: 520px;
    margin-bottom: 40px;
}

.error-actions-axis {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    flex-wrap: wrap;
}

.error-btn-primary, .error-btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 38px;
    border-radius: 30px; /* Rounded capsule button tracking boundaries */
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-decoration: none;
    border: none;
    outline: none;
    cursor: pointer;
    white-space: nowrap;
    box-sizing: border-box;
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform, box-shadow;
}

.error-btn-primary {
    background-color: #0f1115;
    color: #ffffff;
    box-shadow: 0 8px 22px rgba(15, 17, 21, 0.12);
}

.error-btn-primary:hover {
    background-color: #ff4a11;
    box-shadow: 0 10px 25px rgba(255, 74, 17, 0.35);
    transform: translateY(-3px);
}

.error-btn-secondary {
    background-color: transparent;
    color: #0f1115;
    border: 2px solid #e1e4eb;
}

.error-btn-secondary:hover {
    border-color: #0f1115;
    background-color: rgba(15, 17, 21, 0.02);
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .error-actions-axis { flex-direction: column; gap: 12px; }
    .error-btn-primary, .error-btn-secondary { width: 100%; }
}

  </style>

  <script>
// --- SCROLL RESTORATION ENGINE ---
document.addEventListener('DOMContentLoaded', () => {

    // -------------------------------------------------------------
    // BLOCK A: RUNS ON ALL PAGES EXCEPT 404
    // -------------------------------------------------------------
    if (!window.location.pathname.includes('404.html')) {

        // Save current page URL and scroll position before going to 404
        document.querySelectorAll('a[href="404.html"], [onclick*="404.html"]').forEach(link => {

            link.addEventListener('click', () => {
                sessionStorage.setItem('previousPageURL', window.location.href);
                sessionStorage.setItem('previousScrollPosition', window.scrollY);
            });

        });

        // Restore scroll position after returning from 404
        const savedPage = sessionStorage.getItem('previousPageURL');
        const savedScroll = sessionStorage.getItem('previousScrollPosition');

        if (savedPage && savedScroll) {

            // Wait until the page is completely rendered
            window.addEventListener('load', () => {

                window.scrollTo({
                    top: parseInt(savedScroll, 10),
                    behavior: 'instant'
                });

                sessionStorage.removeItem('previousPageURL');
                sessionStorage.removeItem('previousScrollPosition');

            });

        }

    }

    // -------------------------------------------------------------
    // BLOCK B: RUNS ONLY ON 404 PAGE
    // -------------------------------------------------------------
    const historyBackTriggerBtn = document.getElementById('historyBackTriggerBtn');

    if (historyBackTriggerBtn && window.location.pathname.includes('404.html')) {

        historyBackTriggerBtn.addEventListener('click', () => {

            const previousPage = sessionStorage.getItem('previousPageURL');

            if (previousPage) {
                window.location.href = previousPage;
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }

        });

    }

});

  </script>
</body>
</html>
